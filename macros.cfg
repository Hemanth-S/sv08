# =============================================================================
# Custom macros
# =============================================================================

[gcode_macro QGL]
description: Quad Gantry Level — always two-pass (coarse then fine) with safety checks.
             The coarse pass at 15mm provides safe clearance even if the gantry is
             significantly off-level. The fine pass at 2mm only runs after coarse
             has converged within 0.05mm, so the closer probing is safe.
gcode:
    # ---- Pre-flight: ensure all axes are homed ----
    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 X Y
    {% endif %}
    {% if "z" not in printer.toolhead.homed_axes %}
        G28 Z
    {% endif %}

    # ---- Move to safe Z before any QGL motion ----
    # 15mm clears the bed regardless of any current corner offset.
    G90
    G1 Z15 F1500

    # ---- Coarse pass: 15mm probe height, 0.05mm tolerance ----
    # Safe even with severely tilted gantry. Klipper retries until all 4 corners
    # agree within 0.05mm before this command returns.
    QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=15 RETRY_TOLERANCE=0.05

    # ---- Fine pass: 2mm probe height, 0.0075mm tolerance ----
    # After coarse converged, gantry is within 0.05mm of level — 2mm probe
    # height has 1.95mm minimum clearance, plenty for a precision second pass.
    QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2 RETRY_TOLERANCE=0.0075

    # ---- Park at safe height ----
    G1 Z10 F1500
    M118 QGL complete (coarse + fine, gantry within 0.0075mm)

[gcode_macro LOAD_FILAMENT]
description: Heat hotend, then feed filament through the extruder and prime the nozzle. Default temp 220 °C; override with TEMP=...
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}
    M117 Heating to {TEMP}C
    M104 S{TEMP}
    M109 S{TEMP}
    M117 Loading filament
    SAVE_GCODE_STATE NAME=load_filament_state
    G91
    G92 E0
    G1 E50 F300        ; quick feed: gears → heatbreak
    G1 E30 F150        ; slow feed: prime through nozzle
    G92 E0
    RESTORE_GCODE_STATE NAME=load_filament_state
    M117 Filament loaded — wipe nozzle if needed

[gcode_macro UNLOAD_FILAMENT]
description: Heat hotend, then retract filament out of the extruder. Default temp 220 °C; override with TEMP=...
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}
    M117 Heating to {TEMP}C
    M104 S{TEMP}
    M109 S{TEMP}
    M117 Unloading filament
    SAVE_GCODE_STATE NAME=unload_filament_state
    G91
    G92 E0
    G1 E5 F300         ; small extrude: soften tip
    G1 E-20 F1500      ; fast retract: clear heatbreak
    G1 E-100 F1500     ; long retract: clear extruder gears
    G92 E0
    RESTORE_GCODE_STATE NAME=unload_filament_state
    M117 Filament unloaded

# =============================================================================
# PRINT_START — called by the slicer's start G-code.
# =============================================================================
# Slicer start G-code must pass the temps, e.g. (OrcaSlicer/PrusaSlicer syntax):
#   PRINT_START EXTRUDER=[nozzle_temperature_initial_layer] BED=[bed_temperature_initial_layer]
#
# Optional SOAK=<minutes> holds at bed temp before levelling (ABS/ASA in an
# enclosure); defaults to 0 so existing slicer start G-code is unaffected.
#
# Sequence: reset runtime state → heat bed (nozzle to 150) → home → soak → QGL
# → re-home Z → touch-home → bed mesh → heat nozzle → purge.
#
# Z zero comes from CARTOGRAPHER_TOUCH_HOME (the nozzle physically touching the
# plate), not from the scan model. Scan-only homing depends on the eddy coil's
# temperature and on a paper test done with a cold nozzle, so first-layer
# height drifts with bed temp and material. Touch removes both. The plugin
# refuses to touch above 150 C (+2), hence the 150 C wait right before it; 150
# also softens any plastic left on the tip without letting PLA ooze.
[gcode_macro PRINT_START]
description: Slicer entry point — heat, level, touch-home, mesh, purge. Pass EXTRUDER= and BED= (optional SOAK= minutes).
gcode:
    {% set BED = params.BED|default(60)|int %}
    {% set EXTRUDER = params.EXTRUDER|default(220)|int %}
    {% set SOAK = params.SOAK|default(0)|int %}
    {% set cfg = printer.configfile.settings %}

    SET_LED LED=toolhead_leds RED=0 GREEN=0 BLUE=0 WHITE=1.0 SYNC=0    ; full white via W channel to light the print

    # ---- Reset runtime state left over from earlier prints ----
    # Calibration prints (Ellis PA pattern, TUNING_TOWER) change PA, accel and
    # retraction at runtime, and those values stick until a restart; the PA
    # pattern alone leaves PA at 0. Reload every one from the config so each
    # print starts from a known state. The filament profile's start G-code then
    # applies its per-material values on top.
    CLEAR_PAUSE
    SET_GCODE_OFFSET Z=0
    M221 S100                      ; flow back to 100% (an EM test or cancelled print can leave it changed)
    M220 S100                      ; speed factor back to 100%
    SET_PRESSURE_ADVANCE ADVANCE={cfg.extruder.pressure_advance}
    SET_VELOCITY_LIMIT ACCEL={cfg.printer.max_accel}
    SET_RETRACTION RETRACT_LENGTH={cfg.firmware_retraction.retract_length} RETRACT_SPEED={cfg.firmware_retraction.retract_speed} UNRETRACT_EXTRA_LENGTH={cfg.firmware_retraction.unretract_extra_length} UNRETRACT_SPEED={cfg.firmware_retraction.unretract_speed}

    M117 Heating bed to {BED}C
    M140 S{BED}                    ; start bed heating (no wait)
    M104 S150                      ; nozzle to touch temp (no wait)
    G28                            ; home all axes (scan)
    M190 S{BED}                    ; wait for bed temp

    {% if SOAK > 0 %}
        M117 Heat soak {SOAK} min
        G90
        G1 X175 Y175 Z10 F6000     ; park over the bed centre while the frame settles
        G4 P{SOAK * 60000}
    {% endif %}

    QGL                            ; quad gantry level (two-pass macro)
    G28 Z                          ; re-home Z — QGL tilted the gantry

    M117 Touch homing
    # Range waits, not M109: M109 also waits for the reading to stop moving,
    # and the hotend thermistor jitters ~0.7 C/s, so M109 could hang for minutes.
    M104 S150
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=145 MAXIMUM=151   ; touch requires <= 150 (+2); also waits down if hotter
    # Relieve nozzle pressure before touching. Right after a filament load the
    # nozzle keeps oozing even at 150 C; the first touch leaves a dab of PLA on
    # the plate and every later touch lands on it (seen 2026-10-04: touches
    # climbed from -0.08 to +0.26 and TOUCH_HOME failed). Undone before the purge.
    M83                            ; relative extrusion
    G1 E-1 F1800
    CARTOGRAPHER_TOUCH_HOME        ; true Z0: nozzle touches the plate
    _CHECK_TOUCH_HOME              ; abort if touch and scan disagree (plastic on the tip)

    M117 Bed mesh
    BED_MESH_CALIBRATE             ; fresh mesh at print temp

    M117 Heating nozzle to {EXTRUDER}C
    G90
    G1 Z10 F600
    G1 X5 Y20 F6000                ; park at purge-line start (front-left, outside the mesh; edge values are used)
    M104 S{EXTRUDER}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER - 2} MAXIMUM={EXTRUDER + 10}   ; wait for nozzle temp

    # ---- Purge line: draw a short bead up the left edge, then wipe ----
    # The E amounts are relative, so set M83 explicitly. Klipper starts in
    # absolute mode after every restart, which turned the "E12" return pass
    # into a 6 mm retract at full temperature (18 -> 12), pulling melt up into
    # the heatbreak and starting the print 6 mm short.
    M83                            ; relative extrusion
    G92 E0
    G1 Z0.3 F600
    G1 E1 F1800                    ; undo the pre-touch retract
    G1 X5 Y120 E18 F1200           ; primary purge line
    G1 X5.4 Y120 F6000
    G1 X5.4 Y20 E12 F1200          ; return pass to double the bead
    G92 E0
    G1 Z2 F600
    M117 Printing

# =============================================================================
# _CHECK_TOUCH_HOME: called by PRINT_START right after CARTOGRAPHER_TOUCH_HOME.
# =============================================================================
# Touch homing reports how far the touched bed is from where the scan model
# (G28 Z) put it. That gap is normally small: -0.13 to +0.04 mm across the
# 2026-10-02..07 runs. On 2026-10-07, right after a 100 mm filament flush, it
# was -0.276 with five touches agreeing: the nozzle touched a bead of plastic
# on its own tip, Z0 was set ~0.3 mm high and the first layer would not stick.
# Agreement between touches can't catch that, so stop the print instead.
# Rendered when it runs (after the touch), so it reads the fresh result.
[gcode_macro _CHECK_TOUCH_HOME]
description: Abort the print if touch homing disagrees with the scan model by more than 0.2 mm.
gcode:
    {% set z = printer.cartographer.touch.last_z_result %}
    {% if z is not none and (z|float)|abs > 0.2 %}
        {action_raise_error("Touch homing found the bed %.3f mm from where the probe expected (limit 0.2 mm). Usually plastic on the nozzle tip: heat to 200 C, brush the tip clean, then restart the print." % (z|float))}
    {% endif %}

# =============================================================================
# PRINT_END — called by the slicer's end G-code.
# =============================================================================
[gcode_macro PRINT_END]
description: Slicer exit point — retract, park, cool down, motors off.
gcode:
    SAVE_GCODE_STATE NAME=print_end_state
    M400                           ; wait for moves to finish
    {% set z_safe = [printer.toolhead.position.z + 10, printer.toolhead.axis_maximum.z]|min %}
    G92 E0
    G91                            ; relative
    G1 E-3 F1800                   ; retract filament tip
    TURN_OFF_HEATERS
    M107                           ; part fan off
    G90                            ; absolute
    G1 Z{ z_safe } F600            ; lift 10mm, clamped to Z max
    G1 X175 Y330 F6000             ; present the print at the back
    M84                            ; disable steppers
    SET_LED LED=toolhead_leds RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0    ; LEDs off when print is done
    RESTORE_GCODE_STATE NAME=print_end_state
    M117 Done

# =============================================================================
# PARK_FRONT — bring the toolhead to the front-center and lift, for easy
# filament changes / nozzle access. Heaters are left untouched.
# =============================================================================
[gcode_macro PARK_FRONT]
description: Park toolhead front-center and lift (Z30) for filament/nozzle access.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28                        ; must be homed before we can position safely
    {% endif %}
    # Lift to Z30, but never move DOWN — protects a tall print if run mid-job.
    {% set z_target = [30, printer.toolhead.position.z]|max %}
    SAVE_GCODE_STATE NAME=park_front_state
    G90                            ; absolute
    G1 Z{ z_target } F600          ; lift first to clear the bed / any print
    G1 X175 Y5 F6000               ; front-center of the 350x350 bed
    RESTORE_GCODE_STATE NAME=park_front_state
    M117 Parked front — ready for access
