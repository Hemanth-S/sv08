# =============================================================================
# Extruder — Phaetus Conch hotend + Bondtech compound + LDO Orbiter
# =============================================================================
# Mounted on the LDO Jabberwocky toolhead; driven by the Nitehawk-36.
#
# IMPORTANT — pin assignments need verification against the LDO Nitehawk-36 docs:
#   https://docs.ldomotors.com/en/Toolboard/nitehawk-36
# If Klipper rejects any pin on RESTART, check the docs and adjust.
#
# rotation_distance calibrated 2026-09-06 via Ellis' extruder calibration:
# 120 mm marked, 100 mm commanded, 25 mm remaining -> 95 mm actual.
#   4.637 * 95/100 = 4.405
# (Was 4.637, the LDO Jabberwocky default for Bondtech LGX-style gears.)
# An earlier 92 mm read was a tape-measure error; two ruler reads both gave 25 mm.
# Re-verify with another EXTRUSION_TEST; should now land within ~1-2% (98-102 mm).
#
# max_temp is conservative at 280 °C for the NTC variant of the Conch. PT1000
# variants can go to 450 °C, but you have NTC.

[extruder]
step_pin: nitehawk:gpio23
dir_pin: !nitehawk:gpio24
enable_pin: !nitehawk:gpio25
microsteps: 32
rotation_distance: 4.405

# Pressure advance 0.05 for PLA. Measured 2026-10-02 with Ellis' PA pattern
# tool at the conditions real prints use: 205 C, bed 55, 2000 mm/s^2 (=
# external_perimeter_acceleration), line width 110%, EM 1.00, 0.005 steps.
# 0.03 still showed a slight corner bulge; 0.05 was flattest; above 0.05 a
# different bulge appeared. Matches LDO's Jabberwocky reference (0.052).
# The earlier 0.03 (2026-09-09) was measured before the Z rotation_distance
# fix (layers printed at 75% height) with the extruder in stealthChop at
# ~0.55 A; the extra plastic masked the bulge.
# This is the default PRINT_START restores; per-material values go in each
# filament profile's start G-code (SET_PRESSURE_ADVANCE).
# smooth_time left at the Klipper default of 0.040.
# Re-check if the hotend, extruder, filament, or print temp/accel change.
pressure_advance: 0.05

nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: nitehawk:gpio9
sensor_type: Generic 3950
sensor_pin: nitehawk:gpio29
pullup_resistor: 2200
min_temp: 0
max_temp: 280
min_extrude_temp: 170
max_extrude_only_distance: 200

# Driver settings follow LDO's Jabberwocky reference config (JW_NH36_config.cfg)
# and the Nitehawk-36 reference config (MotorDynamicsLab/Nitehawk-36):
#   - sense_resistor 0.100: the Nitehawk-36's value. Without it Klipper assumes
#     its 0.110 default and every current it sets is ~10% off.
#   - run_current 0.65: LDO says 0.55 minimum, do not exceed 0.7 (motor heat).
#     Was 0.5 here, below LDO's minimum.
#   - stealthchop_threshold 0: spreadCycle, as LDO ships it. Was 999999
#     (stealthChop always on), which gives up torque the compound drive needs
#     against the Conch's back-pressure, PA corrections and fast retractions.
#   - interpolate false + chopper timings: LDO's values for this motor.
[tmc2209 extruder]
uart_pin: nitehawk:gpio0
tx_pin: nitehawk:gpio1
sense_resistor: 0.100
interpolate: false
run_current: 0.65
stealthchop_threshold: 0
driver_TBL: 1
driver_TOFF: 3
driver_HSTRT: 0
driver_HEND: 3

# ---- Hotend cooling fan (HEC connector — auto-on when extruder hot) ----
# No tachometer: the fan runs and switches off correctly on the HEF port, but
# its speed line never pulses (verified 2026-09-30: spinning at 100% with the
# counter stuck, stops when Klipper turns it off below 50 C). Most likely a
# 2-wire fan. With tachometer_pin set, Mainsail showed a permanent 0 RPM that
# reads like a dead fan. Re-add tachometer_pin: nitehawk:gpio16 if the fan is
# swapped for a 3-wire one.
[heater_fan hotend_fan]
pin: nitehawk:gpio5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

# =============================================================================
# Firmware retraction — enables G10/G11 and SET_RETRACTION
# =============================================================================
# Added to allow retraction tuning via Klipper's TUNING_TOWER, which sweeps
# RETRACT_LENGTH by Z height in a single print. PrusaSlicer has no built-in
# retraction calibration generator, so this is the practical route.
#
# Requires "Use firmware retraction" in PrusaSlicer
# (Printer Settings -> General -> Advanced). Inert until that is enabled --
# without it PrusaSlicer emits plain G1 E moves and ignores these values.
#
# Starting values are Ellis' direct-drive recommendations, NOT yet calibrated.
[firmware_retraction]
retract_length: 0.5
retract_speed: 30
unretract_extra_length: 0
unretract_speed: 30
