# =============================================================================
# Extruder — Phaetus Conch hotend + Bondtech compound + LDO Orbiter
# =============================================================================
# Mounted on the LDO Jabberwocky toolhead; driven by the Nitehawk-36.
#
# IMPORTANT — pin assignments need verification against the LDO Nitehawk-36 docs:
#   https://docs.ldomotors.com/en/Toolboard/nitehawk-36
# If Klipper rejects any pin on RESTART, check the docs and adjust.
#
# rotation_distance calibrated 2026-09-06 via Ellis' extruder calibration:
# 120 mm marked, 100 mm commanded, 25 mm remaining -> 95 mm actual.
#   4.637 * 95/100 = 4.405
# (Was 4.637, the LDO Jabberwocky default for Bondtech LGX-style gears.)
# An earlier 92 mm read was a tape-measure error; two ruler reads both gave 25 mm.
# Re-verify with another EXTRUSION_TEST; should now land within ~1-2% (98-102 mm).
#
# max_temp is conservative at 280 °C for the NTC variant of the Conch. PT1000
# variants can go to 450 °C, but you have NTC.

[extruder]
step_pin: nitehawk:gpio23
dir_pin: !nitehawk:gpio24
enable_pin: !nitehawk:gpio25
microsteps: 32
rotation_distance: 4.405
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: nitehawk:gpio9
sensor_type: Generic 3950
sensor_pin: nitehawk:gpio29
pullup_resistor: 2200
min_temp: 0
max_temp: 280
min_extrude_temp: 170
max_extrude_only_distance: 200

[tmc2209 extruder]
uart_pin: nitehawk:gpio0
tx_pin: nitehawk:gpio1
run_current: 0.5
stealthchop_threshold: 999999

# ---- Hotend cooling fan (HEC connector — auto-on when extruder hot) ----
[heater_fan hotend_fan]
pin: nitehawk:gpio5
tachometer_pin: ^nitehawk:gpio16
tachometer_poll_interval: 0.001
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
