# Mainsail UI integration — virtual SD card, pause/resume/cancel macros, status display.
# Lifted from the mainsail-crew/mainsail-config recommended starter.

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

# Lets Mainsail skip one object mid-print (the slicer labels objects with
# EXCLUDE_OBJECT_DEFINE / START / END since 2026-10-24).
[exclude_object]

[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  CLEAR_PAUSE
  SDCARD_RESET_FILE
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

# Pausing (also what a filament runout triggers) stretches the idle timeout to
# 2 h: the default 10 min would turn off the heaters and motors mid-pause, and
# a print that lost its position can't be resumed. Heaters stay on so the
# filament can be swapped (UNLOAD_FILAMENT / LOAD_FILAMENT TEMP=<print temp>).
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
variable_extrude: 1.0
variable_pause_timeout: 7200
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_temp VALUE={printer.extruder.target}
  SET_IDLE_TIMEOUT TIMEOUT={pause_timeout}
  M118 Paused: heaters stay on for {(pause_timeout / 60)|int} min. Swap filament with UNLOAD_FILAMENT / LOAD_FILAMENT TEMP={printer.extruder.target|int}, wipe the nozzle, then RESUME.
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}

# Back to the nozzle temperature the print paused at (LOAD_FILAMENT may have
# changed it), waiting with a range because M109 can hang on thermistor
# jitter, then the normal idle timeout again.
[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
variable_extruder_temp: 0
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {% else %}
    {% set get_params = "" %}
  {% endif %}
  {% if extruder_temp > 0 %}
    M104 S{extruder_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp - 3} MAXIMUM={extruder_temp + 5}
  {% endif %}
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  RESUME_BASE {get_params}
